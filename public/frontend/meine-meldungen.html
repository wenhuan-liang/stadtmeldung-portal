<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixMyCity – Meine Meldungen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body data-page="meine-meldungen">
  <header class="navbar">
    <span class="navbar-brand">FixMyCity</span>
    <nav class="navbar-tabs">
      <a href="index.html" class="tab">Hauptseite</a>
      <a href="meine-meldungen.html" class="tab tab--active">Meine Meldungen</a>
    </nav>
    <div class="navbar-auth" id="navbar-auth"></div>
  </header>

  <!-- Auth-Check: Anonym-User auf Login umleiten -->
  <script>
    (function () {
      const s = JSON.parse(sessionStorage.getItem('stadtmeldung_user') || 'null');
      if (!s || s.role === 'anonymous') window.location.href = 'login.html';
    })();
  </script>

  <main class="layout">
    <div class="col-left">
      <section class="card filter-card">
        <h2 class="card-title">Filter</h2>
        <div class="filter-group">
          <label class="filter-label">
            <input type="checkbox" value="Defekt" checked>
            <span class="filter-dot" style="background: #D4622A"></span>
            Defekt
          </label>
          <label class="filter-label">
            <input type="checkbox" value="Verunreinigung" checked>
            <span class="filter-dot" style="background: #4A9A5E"></span>
            Verunreinigung
          </label>
          <label class="filter-label">
            <input type="checkbox" value="Parkvergehen" checked>
            <span class="filter-dot" style="background: #3A78BE"></span>
            Parkvergehen
          </label>
          <label class="filter-label">
            <input type="checkbox" value="Sonstiges" checked>
            <span class="filter-dot" style="background: #888888"></span>
            Sonstiges
          </label>
        </div>
      </section>

      <div class="map-card">
        <div id="map"></div>
      </div>
    </div>

    <div class="col-right">
      <!-- Listenansicht -->
      <div id="view-list">
        <section class="card reports-card">
          <h2 class="card-title">Meine Meldungen</h2>
          <div class="stats-row" id="stats-row"></div>
          <ul class="reports-list" id="reports-list"></ul>
        </section>
      </div>

      <!-- Bearbeitungsansicht -->
      <div id="view-edit" style="display:none">
        <section class="card">
          <div class="admin-detail-header">
            <button class="admin-back-btn" id="btn-edit-back">← Zurück</button>
            <h2 class="card-title" style="margin:0">Meldung bearbeiten</h2>
          </div>
          <form id="edit-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="edit-title">Titel</label>
              <input class="form-input" type="text" id="edit-title">
              <p class="field-error" id="edit-error-title"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-category">Kategorie</label>
              <select class="form-input form-select" id="edit-category">
                <option value="Defekt">Defekt</option>
                <option value="Verunreinigung">Verunreinigung</option>
                <option value="Parkvergehen">Parkvergehen</option>
                <option value="Sonstiges">Sonstiges</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-description">
                Beschreibung <span class="form-optional">(optional)</span>
              </label>
              <textarea class="form-input form-textarea" id="edit-description"
                placeholder="Beschreibung …"></textarea>
            </div>
            <button type="submit" class="btn-submit">Änderungen speichern</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <button class="fab" id="btn-neue-meldung">
    <span class="fab-icon">+</span>
    Neue Meldung
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="auth.js?v=3"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
