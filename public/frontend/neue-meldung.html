<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixMyCity – Neue Meldung</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/fixmycity-logo.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body data-page="neue-meldung">
  <header class="navbar">
    <a class="navbar-brand" href="index.html">
      <img src="/frontend/fixmycity-logo.svg" alt="" width="36" height="36">
      <span>FixMyCity</span>
    </a>
    <nav class="navbar-tabs">
      <a href="index.html" class="tab">Hauptseite</a>
      <a href="meine-meldungen.html" class="tab citizen-only">Meine Meldungen</a>
    </nav>
    <div class="navbar-auth" id="navbar-auth"></div>
  </header>

  <main class="layout">
    <!-- Karte zur Standortauswahl -->
    <div class="col-left">
      <section class="card">
        <h2 class="card-title">Standort auswählen</h2>
        <p class="location-hint" id="location-hint">Klicke auf die Karte, um einen Standort zu markieren.</p>
        <button type="button" class="btn-gps" id="btn-gps">GPS-Standort verwenden</button>
        <div class="map-card" style="margin-top: 12px;">
          <div id="map"></div>
        </div>
        <div class="coord-display" id="coord-display" style="display: none;">
          <div>
            <span class="meta-label">Breitengrad</span>
            <span class="meta-value" id="lat-display">–</span>
          </div>
          <div>
            <span class="meta-label">Längengrad</span>
            <span class="meta-value" id="lng-display">–</span>
          </div>
        </div>
      </section>
    </div>

    <!-- Formular -->
    <div class="col-right">
      <section class="card">
        <h2 class="card-title">Neue Meldung</h2>
        <form id="neue-meldung-form" novalidate>
          <div class="form-error" id="form-error" style="display: none;"></div>

          <div class="form-group">
            <label class="form-label" for="input-title">Titel</label>
            <input class="form-input" type="text" id="input-title"
              placeholder="z. B. Straßenlaterne an der Ecke Hauptstraße/Lindenweg" required maxlength="120">
          </div>

          <div class="form-group">
            <label class="form-label" for="input-category">Kategorie</label>
            <select class="form-input form-select" id="input-category" required>
              <option value="">Bitte wählen …</option>
              <option value="Defekt">Defekt</option>
              <option value="Verunreinigung">Verunreinigung</option>
              <option value="Parkvergehen">Parkvergehen</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>

          <div class="form-group" id="defect-type-group" style="display: none;">
            <label class="form-label" for="input-defect-type">Konkrete Defektart</label>
            <select class="form-input form-select" id="input-defect-type">
              <option value="">Bitte Defektart wählen …</option>
              <option value="POTHOLE">Schlagloch / abgesackte Fahrbahn</option>
              <option value="ROAD_SURFACE">Risse oder Abplatzungen in der Fahrbahn</option>
              <option value="SIDEWALK">Beschädigter Gehweg oder Bordstein</option>
              <option value="STREETLIGHT">Defekte Straßenbeleuchtung</option>
              <option value="TRAFFIC_SIGN">Beschädigtes oder fehlendes Verkehrsschild</option>
              <option value="BENCH_OR_PLAYGROUND">Beschädigte Bank oder Spielgerät</option>
              <option value="OTHER_DEFECT">Anderer Defekt</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="input-description">Beschreibung</label>
            <textarea class="form-input form-textarea" id="input-description"
              placeholder="Was ist beschädigt? Seit wann besteht der Schaden? Gibt es eine Gefahr für Verkehr oder Personen?" required maxlength="2000"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="input-photo">
              Foto <span class="form-optional">(optional)</span>
            </label>
            <input class="form-input form-file" type="file" id="input-photo" accept="image/jpeg,image/png,image/webp,image/gif">
            <div id="photo-preview-wrap" style="display: none;">
              <img id="photo-preview" class="photo-preview" alt="Vorschau">
            </div>
          </div>

          <button type="submit" class="btn-submit">Meldung senden</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <span>Impressum</span>
    <span class="site-footer-separator" aria-hidden="true">—</span>
    <span>FixMyCity © 2026 HWG Ludwigshafen</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="api.js?v=1"></script>
  <script src="auth.js?v=11"></script>
  <script src="neue-meldung.js?v=4"></script>
</body>
</html>
