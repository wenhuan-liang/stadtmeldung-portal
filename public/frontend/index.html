<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="hauptseite">
  <header class="navbar">
    <span class="navbar-brand">Report Tool</span>
    <nav class="navbar-tabs">
      <a href="index.html" class="tab tab--active">Hauptseite</a>
      <a href="meine-meldungen.html" class="tab">Meine Meldungen</a>
    </nav>
    <div class="navbar-auth" id="navbar-auth"></div>
  </header>

  <script>
    (function () {
      const s = JSON.parse(sessionStorage.getItem('stadtmeldung_user') || 'null');
      if (!s) window.location.href = 'login.html';
    })();
  </script>

  <main class="layout">
    <div class="col-left">
      <section class="card filter-card">
        <h2 class="card-title">Filter</h2>
        <div class="filter-group">
          <label class="filter-label">
            <input type="checkbox" value="Defekt" checked>
            <span class="filter-dot" style="background: #D4622A"></span>
            Defekt
          </label>
          <label class="filter-label">
            <input type="checkbox" value="Verunreinigung" checked>
            <span class="filter-dot" style="background: #4A9A5E"></span>
            Verunreinigung
          </label>
          <label class="filter-label">
            <input type="checkbox" value="Parkvergehen" checked>
            <span class="filter-dot" style="background: #3A78BE"></span>
            Parkvergehen
          </label>
          <label class="filter-label">
            <input type="checkbox" value="Sonstiges" checked>
            <span class="filter-dot" style="background: #888888"></span>
            Sonstiges
          </label>
        </div>
      </section>

      <div class="map-card">
        <div id="map"></div>
      </div>
    </div>

    <div class="col-right">
      <section class="card reports-card">
        <h2 class="card-title">Alle Meldungen</h2>
        <div class="stats-row" id="stats-row"></div>
        <ul class="reports-list" id="reports-list">
          <!-- wird von app.js befüllt -->
        </ul>
      </section>
    </div>
  </main>

  <button class="fab" id="btn-neue-meldung">
    <span class="fab-icon">+</span>
    Neue Meldung
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="auth.js?v=3"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
